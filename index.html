<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Neon Pong</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <div id="game-wrapper">
        <div id="ui-layer">
            <div id="scoreboard">
                <div class="score-box">
                    <span class="label">PLAYER</span>
                    <span id="player-score" class="score">0</span>
                </div>
                <div class="score-divider"></div>
                <div class="score-box">
                    <span class="label">CPU</span>
                    <span id="ai-score" class="score">0</span>
                </div>
            </div>

            <div id="overlay" class="visible">
                <div id="start-screen" class="menu-content">
                    <h1>NEON PONG</h1>
                    <p>Defeat the CPU in a high-speed duel</p>
                    <button id="start-btn">START GAME</button>
                    <div class="controls-hint">
                        <span>MOUSE or W/S to Move</span>
                        <span>SPACE to Pause</span>
                    </div>
                </div>

                <div id="pause-screen" class="menu-content hidden">
                    <h1>PAUSED</h1>
                    <button id="resume-btn">RESUME</button>
                </div>

                <div id="game-over-screen" class="menu-content hidden">
                    <h1 id="result-text">YOU WIN!</h1>
                    <p id="final-score-text">Final Score: 10 - 5</p>
                    <button id="restart-btn">PLAY AGAIN</button>
                </div>
            </div>
        </div>
        <canvas id="pong-canvas"></canvas>
    </div>

    <script src="game.js"></script>
</body>
</html>
